  # ===================================================================================
  # DECLINED (12) - THE CALIBRATION SET. This is what objective (b) is measured on.
  #
  # Construction: the corpus COVERS the topic but conspicuously omits the specific
  # figure, period, or list being asked for. These documents repeatedly say a rule
  # exists without giving its content - "لمدة محددة", "للمدة التي يحددها القانون",
  # "في مواعيدها", "أحوال معينة". Asking for those numbers retrieves the exactly-right
  # section, which then turns out not to contain the answer.
  #
  # That is much harder, and much more realistic, than an off-topic question: the
  # model has highly relevant context in front of it and has to notice the answer
  # isn't in it. A model pattern-matching on topic will confidently invent a number.
  # ===================================================================================

