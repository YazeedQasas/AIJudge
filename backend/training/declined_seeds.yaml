# Seed questions for construction #2 ("weak-but-passing") - see the plan's B6 table.
#
# UNLIKE seed_questions.yaml, these are NOT written from content that exists in
# their source_doc. Each asks for a specific figure, period, percentage, or count
# that the named document conspicuously omits - it says a rule exists ("لمدة
# محددة", "بحسب ظروف الحال", "وفق الإجراءات القانونية") without giving its
# content. That phrasing is legally on-topic enough that retrieval genuinely
# clears the relevance gate (top score >= 0.5, verified live against Qdrant - see
# the `top=` comment on each entry, same discipline as eval/cases.yaml), but the
# retrieved chunks don't actually answer the question. The model has to notice
# that, not pattern-match on topic and invent a number.
#
# This is exactly the shape of eval/cases.yaml's own 12 DECLINED cases (see its
# header comment) - deliberately: it's the only well-understood way to construct
# this failure mode. What keeps these from being contamination is that they target
# a DIFFERENT omitted figure, mostly in DIFFERENT documents, than any eval case -
# checked with training.contamination.check_contamination when written (zero hits),
# and re-checked by training.validate on every full-dataset run.
#
# Deliberately skips documents eval already covers heavily for this construction
# (employment: 3 cases: evidence, intellectual_property: 2 cases; negotiable;
# property; wills) - adding more there raises contamination risk for low added
# value when 13 other documents have none yet.

seeds:
