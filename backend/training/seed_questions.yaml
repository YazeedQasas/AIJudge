# Seed questions for Stage B dataset construction.
#
# ~5 hand-written questions per corpus document (bnacked/data/sample_corpus/),
# grouped by source_doc with a `kind` tag:
#   definitional - asks directly for a rule, element, or definition
#   scenario      - a short fact pattern requiring the reader to apply the rule
# Expansion (B8) paraphrases each of these into 3-4 further variants (formal vs.
# colloquial, short vs. multi-part) - that is the OTHER axis of variation, added
# on top of these, not duplicated here.
#
# All seeds here are "answered"-flavored: each is written from content that
# genuinely exists in its source_doc, so retrieval should find real coverage. The
# negative constructions (declined / mismatched / partial - see the plan's B6/B7)
# are produced downstream by build_dataset.py deliberately manipulating retrieval
# on top of these same seeds, not by writing separate negative questions here.
#
# CONTAMINATION: these feed training/build_dataset.py and must never duplicate an
# eval/cases.yaml question - that list is the project's permanent yardstick, and
# training on it would make later scores measure memorization, not improvement.
# Checked by hand against eval/cases.yaml when written; the contamination guard
# (B6) re-checks it programmatically before any teacher call, and is the thing to
# trust once it exists - not this comment.

